<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>AlphaGroupOfDevelopers</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // See: https://github.com/rafgraph/spa-github-pages
      var segmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '~q~' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

</html>
